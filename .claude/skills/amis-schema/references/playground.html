<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>amis Schema Playground（离线仓库可用）</title>
  <!-- CDN 版 SDK：改版本号换 amis 版本（如 amis@6 / amis@6.7.0）。需联网加载。 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/amis@6/sdk/sdk.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/amis@6/sdk/iconfont.css" />
  <script src="https://cdn.jsdelivr.net/npm/amis@6/sdk/sdk.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .toolbar { padding: 8px 12px; background: #f5f5f5; border-bottom: 1px solid #ddd; display: flex; gap: 8px; align-items: center; }
    .toolbar button { padding: 4px 14px; cursor: pointer; }
    .editor { width: 100%; height: 240px; box-sizing: border-box; font-family: monospace; font-size: 12px; padding: 8px; border: none; border-bottom: 1px solid #ddd; outline: none; }
    #error { color: #d00; padding: 6px 12px; font-family: monospace; font-size: 12px; white-space: pre-wrap; display: none; }
    #root { padding: 12px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="renderSchema()">渲染 (Ctrl/⌘+Enter)</button>
    <span style="color:#888;font-size:12px">粘贴 schema → 渲染。默认开启 amisDebug 调试面板（右侧）。</span>
  </div>
  <textarea class="editor" id="schemaText" spellcheck="false"></textarea>
  <div id="error"></div>
  <div id="root"></div>

  <script>
    // 默认示例：覆盖数据域(initApi)、模板、表单三个高频点；接口不可达时改用静态数据验证
    const defaultSchema = {
      type: 'page',
      title: 'Playground',
      body: [
        { type: 'tpl', tpl: '当前时间：${NOW|date:YYYY-MM-DD HH:mm:ss}' },
        {
          type: 'form',
          title: '常用控件',
          body: [
            { type: 'input-text', name: 'username', label: '用户名', required: true },
            { type: 'select', name: 'role', label: '角色', options: ['admin', 'user'], visibleOn: 'this.username' },
            { type: 'button', label: '提交', actionType: 'submit' }
          ]
        }
      ]
    };

    let scoped = null;

    /**
     * 渲染 textarea 中的 JSON schema。
     * 解析失败或渲染异常时把报错显示在页面上，方便定位 schema 问题。
     */
    function renderSchema() {
      const errBox = document.getElementById('error');
      errBox.style.display = 'none';
      let schema;
      try {
        schema = JSON.parse(document.getElementById('schemaText').value);
      } catch (e) {
        errBox.textContent = 'JSON 解析失败：' + e.message;
        errBox.style.display = 'block';
        return;
      }
      try {
        scoped = amis.embed('#root', schema, {}, { enableAMISDebug: true });
        // 主题切换示例：amis.embed('#root', schema, {}, {theme: 'antd'})
      } catch (e) {
        errBox.textContent = '渲染失败：' + (e && e.message);
        errBox.style.display = 'block';
      }
    }

    document.getElementById('schemaText').value = JSON.stringify(defaultSchema, null, 2);
    document.getElementById('schemaText').addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') renderSchema();
    });
    renderSchema();
  </script>
</body>
</html>
