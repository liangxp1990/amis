# amis 文档站（amis.elstgl.com）nginx 配置
# 静态站挂 /amis/（产物路径前缀由 fis-conf domain 决定），API 同源反代 mock 容器。
server {
    listen 80;
    client_max_body_size 0;

    # 文档示例的 /api/... 在 IS_AISUDA 构建下重写为 /amis/api/...，
    # 这里转给 mock 容器（与 vite mockApiPlugin 行为一致）
    location /amis/api/ {
        proxy_pass http://amis-mock:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }

    # 静态产物 + SPA fallback（BrowserRouter 直访/刷新）
    location /amis/ {
        try_files $uri $uri/ /amis/index.html;
    }
}
